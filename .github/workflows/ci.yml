name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Run tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t my-mf-portfolio:${{ github.sha }} .
      - name: Smoke test Streamlit
        run: |
          docker run -d --name app -p 8501:8501 my-mf-portfolio:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf http://localhost:8501/_stcore/health && break; sleep 1; done
          curl -sf http://localhost:8501/_stcore/health | grep -q ok
